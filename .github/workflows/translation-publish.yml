name: Translation Publish

on:
  workflow_dispatch:
    inputs:
      translation_version:
        description: "New immutable translation version, for example version-6"
        required: true
        type: string

      run_frontend_ci:
        description: "Run Frontend CI after publishing"
        required: true
        default: true
        type: boolean


permissions:
  contents: read
  actions: write


concurrency:
  group: translation-publish
  cancel-in-progress: false


jobs:
  publish:
    name: Generate and publish translations

    runs-on: ubuntu-latest

    timeout-minutes: 20

    env:
      TRANSLATION_VERSION: ${{ inputs.translation_version }}

      # Azure Translator
      AZURE_TRANSLATOR_ENDPOINT: ${{ vars.AZURE_TRANSLATOR_ENDPOINT }}
      AZURE_TRANSLATOR_REGION: ${{ vars.AZURE_TRANSLATOR_REGION }}
      AZURE_TRANSLATOR_KEY: ${{ secrets.AZURE_TRANSLATOR_KEY }}

      # Cloudflare R2
      R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
      R2_BUCKET: ${{ vars.R2_BUCKET }}

      # TranslationService WRITE credentials
      R2_ACCESS_KEY_ID: ${{ secrets.TRANSLATION_R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.TRANSLATION_R2_SECRET_ACCESS_KEY }}


    steps:

      # -----------------------------------------------------
      # 1. Repository
      # -----------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v6


      # -----------------------------------------------------
      # 2. Node / Angular
      # -----------------------------------------------------

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: FrontendApp/package-lock.json


      - name: Install frontend dependencies
        working-directory: FrontendApp
        run: npm ci


      # -----------------------------------------------------
      # 3. Extract current English frontend XLIFF
      # -----------------------------------------------------

      - name: Extract Angular source translations
        working-directory: FrontendApp
        run: npm run extract-i18n


      - name: Verify frontend English XLIFF
        shell: bash
        run: |
          if [ ! -f "FrontendApp/src/locale/messages.xlf" ]; then
            echo "::error::Frontend messages.xlf was not generated."
            exit 1
          fi

          echo "Frontend English XLIFF exists."


      # -----------------------------------------------------
      # 4. Verify Asset Management English JSON source
      # -----------------------------------------------------

      - name: Verify Asset Management English JSON
        shell: bash
        run: |
          if [ ! -f "TranslationService/sources/asset-management/messages.en.json" ]; then
            echo "::error::Asset Management messages.en.json was not found."
            exit 1
          fi

          echo "Asset Management English JSON exists."


      # -----------------------------------------------------
      # 5. Python / TranslationService
      # -----------------------------------------------------

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"


      - name: Install TranslationService dependencies
        working-directory: TranslationService
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            httpx \
            python-dotenv \
            boto3


      # -----------------------------------------------------
      # 6. Validate required environment configuration
      # -----------------------------------------------------

      - name: Check translation configuration
        shell: bash
        run: |
          : "${TRANSLATION_VERSION:?Missing TRANSLATION_VERSION}"

          : "${AZURE_TRANSLATOR_ENDPOINT:?Missing AZURE_TRANSLATOR_ENDPOINT}"
          : "${AZURE_TRANSLATOR_REGION:?Missing AZURE_TRANSLATOR_REGION}"
          : "${AZURE_TRANSLATOR_KEY:?Missing AZURE_TRANSLATOR_KEY}"

          : "${R2_ENDPOINT:?Missing R2_ENDPOINT}"
          : "${R2_BUCKET:?Missing R2_BUCKET}"
          : "${R2_ACCESS_KEY_ID:?Missing TranslationService R2 access key}"
          : "${R2_SECRET_ACCESS_KEY:?Missing TranslationService R2 secret key}"

          echo "Required configuration is available."


      # -----------------------------------------------------
      # 7. Run TranslationService tests
      # -----------------------------------------------------

      - name: Run TranslationService tests
        working-directory: TranslationService
        run: |
          python -m pip install pytest
          python -m pytest -q


      # -----------------------------------------------------
      # 8. Generate + validate + publish frontend XLIFF
      # -----------------------------------------------------

      - name: Generate validate and publish frontend XLIFF
        working-directory: TranslationService
        run: |
          python -m scripts.generate_and_publish_frontend_xlfs


      # -----------------------------------------------------
      # 9. Generate + validate + publish Asset Management JSON
      # -----------------------------------------------------

      - name: Generate validate and publish Asset Management JSON
        working-directory: TranslationService
        run: |
          python -m scripts.generate_and_publish_asset_management


      # -----------------------------------------------------
      # 10. Prepare GitHub artifact
      # -----------------------------------------------------

      - name: Prepare translation artifact
        shell: bash
        run: |
          mkdir -p translation-artifact/frontend
          mkdir -p translation-artifact/asset-management

          cp \
            FrontendApp/src/locale/messages.xlf \
            translation-artifact/frontend/messages.xlf

          cp \
            TranslationService/artifacts/frontend/messages.fr.xlf \
            translation-artifact/frontend/messages.fr.xlf

          cp \
            TranslationService/artifacts/frontend/messages.de.xlf \
            translation-artifact/frontend/messages.de.xlf

          cp \
            TranslationService/artifacts/asset-management/messages.en.json \
            translation-artifact/asset-management/messages.en.json

          cp \
            TranslationService/artifacts/asset-management/messages.fr.json \
            translation-artifact/asset-management/messages.fr.json

          cp \
            TranslationService/artifacts/asset-management/messages.de.json \
            translation-artifact/asset-management/messages.de.json

          printf '%s\n' "${TRANSLATION_VERSION}" \
            > translation-artifact/translation-version.txt


      - name: Upload generated translation artifact
        uses: actions/upload-artifact@v4
        with:
          name: translations-${{ inputs.translation_version }}
          path: translation-artifact
          retention-days: 7


      # -----------------------------------------------------
      # 11. GitHub Actions summary
      # -----------------------------------------------------

      - name: Write publication summary
        shell: bash
        run: |
          {
            echo "## Translation publication"
            echo ""
            echo "| Property | Value |"
            echo "| --- | --- |"
            echo "| Version | ${TRANSLATION_VERSION} |"
            echo "| Source language | English |"
            echo "| Generated languages | French, German |"
            echo "| Storage | Cloudflare R2 |"
            echo "| Frontend prefix | translations/${TRANSLATION_VERSION}/ |"
            echo "| Asset Management prefix | asset-management/${TRANSLATION_VERSION}/ |"
          } >> "${GITHUB_STEP_SUMMARY}"


      # -----------------------------------------------------
      # 12. Trigger Frontend CI with exact published version
      # -----------------------------------------------------

      - name: Trigger Frontend CI
        if: ${{ inputs.run_frontend_ci }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_BRANCH: ${{ github.ref_name }}
        run: |
          gh workflow run frontend-ci.yml \
            --ref "${SOURCE_BRANCH}" \
            -f translation_version="${TRANSLATION_VERSION}"

          echo "Frontend CI triggered."
          echo "Translation version: ${TRANSLATION_VERSION}"
          echo "Branch: ${SOURCE_BRANCH}"