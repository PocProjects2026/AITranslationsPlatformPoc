name: InventoryService - Develop
run-name: "InventoryService - Develop - run #${{ github.run_number }}"

on:
  push:
    branches:
      - develop
    paths:
      - InventoryService/**
      - pipelines/**
      - .github/workflows/inventory-service-develop.yml

permissions:
  contents: read

concurrency:
  group: inventory-service-development
  cancel-in-progress: true

jobs:
  dotnet:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: InventoryService/global.json

      - name: Validate .NET service
        shell: pwsh
        run: >
          ./pipelines/scripts/common/Test-DotNetService.ps1
          -ServicePath ./InventoryService
          -SolutionFile InventoryService.sln

  container:
    name: Build and smoke-test image
    needs: dotnet
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      image-reference: ${{ steps.publish.outputs.image-reference }}
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_NAME: inventory-service:develop-${{ github.run_id }}
      APP_VERSION: 0.1.0-develop.${{ github.run_number }}
      CONTAINER_NAME: inventory-service-develop-${{ github.run_id }}-${{ github.run_attempt }}
      REGISTRY_IMAGE: ghcr.io/pocprojects2026/ai-translations-inventory-service

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Build image
        shell: pwsh
        run: >
          ./pipelines/scripts/common/Build-ContainerImage.ps1
          -ContextPath ./InventoryService
          -ImageName $env:IMAGE_NAME
          -AppVersion $env:APP_VERSION
          -GitCommit $env:GITHUB_SHA

      - name: Test InventoryService container
        shell: pwsh
        run: >
          ./pipelines/scripts/inventory-service/Test-InventoryServiceContainer.ps1
          -ImageName $env:IMAGE_NAME
          -GitCommit $env:GITHUB_SHA
          -ContainerName $env:CONTAINER_NAME
          -HostPort 8080

      - name: Scan image vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}
          version: v0.70.0
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

      - name: Publish image to GHCR
        id: publish
        env:
          CONTAINER_REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $taggedImage = & ./pipelines/scripts/common/Set-ContainerImageTag.ps1 `
            -LocalImage $env:IMAGE_NAME `
            -RegistryImage $env:REGISTRY_IMAGE `
            -GitCommit $env:GITHUB_SHA `
            -RunId $env:GITHUB_RUN_ID `
            -RunAttempt $env:GITHUB_RUN_ATTEMPT

          $imageReference = & ./pipelines/scripts/common/Push-ContainerImage.ps1 `
            -Image $taggedImage `
            -RegistryUsername $env:GITHUB_ACTOR

          "image-reference=$imageReference" >> $env:GITHUB_OUTPUT
