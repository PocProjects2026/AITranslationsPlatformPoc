name: Frontend CI

on:
  pull_request:
    branches:
      - develop
      - main
    paths:
      - "FrontendApp/**"
      - ".github/workflows/frontend-ci.yml"
      - ".github/workflows/frontend-cd.yml"

  push:
    branches:
      - develop
      - main
      - "feature/**"
    paths:
      - "FrontendApp/**"
      - ".github/workflows/frontend-ci.yml"
      - ".github/workflows/frontend-cd.yml"

  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24.16.0"
  IMAGE_NAME: translation-platform-frontend:${{ github.sha }}
  ARTIFACT_NAME: frontend-localized-build

jobs:
  frontend-quality:
    name: Angular quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: FrontendApp

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: FrontendApp/package-lock.json

      - name: Display tool versions
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Audit npm dependencies
        run: npm audit --audit-level=high

      - name: Run unit tests
        run: npm test -- --watch=false

      - name: Extract Angular i18n messages
        run: npm run extract-i18n

      - name: Verify source XLIFF is up to date
        run: |
          git diff \
            --exit-code \
            --ignore-matching-lines='context-type="linenumber"' \
            -- src/locale/messages.xlf

      - name: Validate XLIFF files
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import sys
          import xml.etree.ElementTree as ET

          files = [
              Path("src/locale/messages.xlf"),
              Path("src/locale/messages.fr.xlf"),
              Path("src/locale/messages.de.xlf"),
          ]

          for file_path in files:
              if not file_path.is_file():
                  print(f"::error::Missing XLIFF file: {file_path}")
                  sys.exit(1)

              try:
                  root = ET.parse(file_path).getroot()
              except ET.ParseError as error:
                  print(f"::error::Invalid XML in {file_path}: {error}")
                  sys.exit(1)

              if root.attrib.get("version") != "1.2":
                  print(f"::error::{file_path} must use XLIFF version 1.2")
                  sys.exit(1)

              print(f"Valid XLIFF file: {file_path}")

          print("All XLIFF files are valid.")
          PY

      - name: Build localized frontend
        run: npm run build:localized

      - name: Upload localized frontend artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: FrontendApp/dist/FrontendApp/browser
          if-no-files-found: error
          retention-days: 30

  container-validation:
    name: Docker container checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: frontend-quality

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build Docker image
        run: |
          docker build \
            --file FrontendApp/Dockerfile \
            --tag "${IMAGE_NAME}" \
            FrontendApp

      - name: Start Docker container
        run: |
          docker run \
            --detach \
            --name frontend-ci \
            --publish 8080:8080 \
            "${IMAGE_NAME}"

      - name: Wait for application
        shell: bash
        run: |
          for attempt in {1..30}; do
            if curl \
              --fail \
              --silent \
              http://127.0.0.1:8080/health > /dev/null; then
              echo "Container is healthy."
              exit 0
            fi

            echo "Waiting for container: attempt ${attempt}/30"
            sleep 2
          done

          echo "::error::Container did not become healthy."
          exit 1

      - name: Test localized routes
        shell: bash
        run: |
          test "$(
            curl \
              --fail \
              --silent \
              --show-error \
              http://127.0.0.1:8080/health
          )" = "ok"

          for route in "/" "/fr/" "/de/"; do
            echo "Testing ${route}"

            status_code="$(
              curl \
                --silent \
                --show-error \
                --location \
                --output /dev/null \
                --write-out "%{http_code}" \
                "http://127.0.0.1:8080${route}"
            )"

            echo "${route} returned HTTP ${status_code}"

            if [ "${status_code}" -lt 200 ] ||
               [ "${status_code}" -ge 400 ]; then
              echo "::error::Route ${route} returned HTTP ${status_code}"
              exit 1
            fi
          done

      - name: Verify security headers
        shell: bash
        run: |
          curl \
            --fail \
            --silent \
            --dump-header response-headers.txt \
            --output /dev/null \
            http://127.0.0.1:8080/

          grep \
            --ignore-case \
            "^X-Content-Type-Options: nosniff" \
            response-headers.txt

          grep \
            --ignore-case \
            "^X-Frame-Options: DENY" \
            response-headers.txt

          grep \
            --ignore-case \
            "^Content-Security-Policy:" \
            response-headers.txt

      - name: Display container logs on failure
        if: failure()
        run: |
          if docker container inspect frontend-ci > /dev/null 2>&1; then
            docker logs frontend-ci
          else
            echo "Container frontend-ci was not created."
          fi

      - name: Remove test container
        if: always()
        run: |
          docker rm --force frontend-ci 2>/dev/null || true

  deploy-rollback-test:
    name: Deploy artifact for rollback test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    needs:
      - frontend-quality
      - container-validation

    if: >
      github.event_name == 'push' &&
      github.ref_name == 'feature/task4-frontend-cd'

    permissions:
      contents: read
      actions: read
      deployments: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check Cloudflare configuration
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "::error::Missing secret: CLOUDFLARE_API_TOKEN"
            exit 1
          fi

          if [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "::error::Missing secret: CLOUDFLARE_ACCOUNT_ID"
            exit 1
          fi

          echo "Cloudflare configuration is available."

      - name: Download artifact from this CI run
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: frontend-build

      - name: Verify downloaded artifact
        shell: bash
        run: |
          echo "Downloaded artifact content:"
          find frontend-build -maxdepth 3 -type f | sort

          required_files=(
            "frontend-build/index.html"
            "frontend-build/fr/index.html"
            "frontend-build/de/index.html"
          )

          for file_path in "${required_files[@]}"; do
            if [ ! -f "${file_path}" ]; then
              echo "::error::Missing deployment file: ${file_path}"
              exit 1
            fi

            echo "Found: ${file_path}"
          done

          echo "The artifact from this CI run is ready for deployment."

      - name: Deploy artifact to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: >-
            pages deploy frontend-build
            --project-name=translation-platform-frontend
            --branch=main
          gitHubToken: ${{ github.token }}

      - name: Get deployment URL
        id: deployment
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          DEPLOYMENT_ALIAS_URL: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
        run: |
          url="${DEPLOYMENT_URL}"

          if [ -z "${url}" ]; then
            url="${DEPLOYMENT_ALIAS_URL}"
          fi

          if [ -z "${url}" ]; then
            echo "::error::Cloudflare did not return a deployment URL."
            exit 1
          fi

          url="${url%/}"

          echo "url=${url}" >> "${GITHUB_OUTPUT}"
          echo "Deployment URL: ${url}"

      - name: Run deployment smoke tests
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deployment.outputs.url }}
        run: |
          for route in "/" "/fr/" "/de/"; do
            deployed=false

            for attempt in {1..10}; do
              status_code="$(
                curl \
                  --silent \
                  --show-error \
                  --location \
                  --output /dev/null \
                  --write-out "%{http_code}" \
                  "${DEPLOYMENT_URL}${route}" || true
              )"

              echo "Attempt ${attempt}: ${route} returned HTTP ${status_code}"

              if [[ "${status_code}" =~ ^[0-9]{3}$ ]] &&
                 [ "${status_code}" -ge 200 ] &&
                 [ "${status_code}" -lt 400 ]; then
                deployed=true
                break
              fi

              sleep 3
            done

            if [ "${deployed}" != "true" ]; then
              echo "::error::Smoke test failed for ${route}"
              exit 1
            fi
          done

          echo "All deployed routes are available."

      - name: Write deployment summary
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deployment.outputs.url }}
        run: |
          {
            echo "## Rollback test deployment"
            echo ""
            echo "| Property | Value |"
            echo "| --- | --- |"
            echo "| Cloudflare project | translation-platform-frontend |"
            echo "| Source branch | ${GITHUB_REF_NAME} |"
            echo "| Cloudflare branch | main |"
            echo "| Source commit | ${GITHUB_SHA} |"
            echo "| CI run ID | ${GITHUB_RUN_ID} |"
            echo "| Artifact | ${ARTIFACT_NAME} |"
            echo "| Deployment URL | ${DEPLOYMENT_URL} |"
            echo "| Production URL | https://translation-platform-frontend.pages.dev |"
          } >> "${GITHUB_STEP_SUMMARY}"