name: CD

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    needs: [] # This would depend on CI in a real setup if they were in the same workflow, or run after CI passes.

    steps:
    - uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v2
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v4
      with:
        context: .
        push: true
        tags: ghcr.io/${{ github.repository }}/asset_manager:latest

    - name: Deploy to production
      env:
        PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
        PROD_HOST: ${{ secrets.PROD_HOST }}
        PROD_USER: ${{ secrets.PROD_USER }}
      run: |
        echo "Simulating deployment to production using secure secrets..."
        # In a real environment, you would SSH into the server and pull the image:
        # ssh -i $PROD_SSH_KEY $PROD_USER@$PROD_HOST "docker pull ghcr.io/${{ github.repository }}/asset_manager:latest && docker-compose up -d"
        echo "Deployment successful."
