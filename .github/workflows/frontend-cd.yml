name: Frontend CD

on:
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: "ID of the successful Frontend CI run"
        required: true
        type: string

      cloudflare_branch:
        description: "Branch name used for the Cloudflare Pages deployment"
        required: true
        default: "develop"
        type: string

  # Temporary trigger to test the CD before creating the Pull Request.
  push:
    branches:
      - feature/task4-frontend-cd
    paths:
      - ".github/workflows/frontend-cd.yml"

permissions:
  contents: read
  actions: read
  deployments: write

concurrency:
  group: frontend-cd-${{ github.event_name == 'workflow_dispatch' && inputs.cloudflare_branch || github.ref_name }}
  cancel-in-progress: false

env:
  ARTIFACT_NAME: frontend-localized-build
  DEPLOY_DIRECTORY: frontend-build
  CLOUDFLARE_PAGES_PROJECT: translation-platform-frontend

  # For the temporary push test, use the artifact from this successful CI run.
  CI_RUN_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.ci_run_id || '30102296017' }}

  # Manual run: use the entered branch.
  # Push test: use feature/task4-frontend-cd automatically.
  CLOUDFLARE_BRANCH: ${{ github.event_name == 'workflow_dispatch' && inputs.cloudflare_branch || github.ref_name }}

jobs:
  deploy:
    name: Deploy frontend to Cloudflare Pages
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check Cloudflare configuration
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "::error::Missing repository secret: CLOUDFLARE_API_TOKEN"
            exit 1
          fi

          if [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "::error::Missing repository secret: CLOUDFLARE_ACCOUNT_ID"
            exit 1
          fi

          echo "Cloudflare configuration is available."
          echo "CI run ID: ${CI_RUN_ID}"
          echo "Cloudflare branch: ${CLOUDFLARE_BRANCH}"

      - name: Download validated frontend artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.DEPLOY_DIRECTORY }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.CI_RUN_ID }}

      - name: Verify downloaded artifact
        shell: bash
        run: |
          echo "Downloaded artifact content:"
          find "${DEPLOY_DIRECTORY}" -maxdepth 3 -type f | sort

          required_files=(
            "${DEPLOY_DIRECTORY}/index.html"
            "${DEPLOY_DIRECTORY}/fr/index.html"
            "${DEPLOY_DIRECTORY}/de/index.html"
          )

          for file_path in "${required_files[@]}"; do
            if [ ! -f "${file_path}" ]; then
              echo "::error::Missing deployment file: ${file_path}"
              exit 1
            fi

            echo "Found: ${file_path}"
          done

          echo "Frontend artifact is ready for deployment."

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy ${{ env.DEPLOY_DIRECTORY }}
            --project-name=${{ env.CLOUDFLARE_PAGES_PROJECT }}
            --branch=${{ env.CLOUDFLARE_BRANCH }}
          gitHubToken: ${{ github.token }}

      - name: Get deployment URL
        id: deployment
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          DEPLOYMENT_ALIAS_URL: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
        run: |
          url="${DEPLOYMENT_URL}"

          if [ -z "${url}" ]; then
            url="${DEPLOYMENT_ALIAS_URL}"
          fi

          if [ -z "${url}" ]; then
            echo "::error::Cloudflare did not return a deployment URL."
            exit 1
          fi

          url="${url%/}"

          echo "url=${url}" >> "${GITHUB_OUTPUT}"
          echo "Deployment URL: ${url}"

      - name: Run deployment smoke tests
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deployment.outputs.url }}
        run: |
          for route in "/" "/fr/" "/de/"; do
            deployed=false

            for attempt in {1..10}; do
              status_code="$(
                curl \
                  --silent \
                  --show-error \
                  --location \
                  --output /dev/null \
                  --write-out "%{http_code}" \
                  "${DEPLOYMENT_URL}${route}" || true
              )"

              echo "Attempt ${attempt}: ${route} returned HTTP ${status_code}"

              if [[ "${status_code}" =~ ^[0-9]{3}$ ]] &&
                 [ "${status_code}" -ge 200 ] &&
                 [ "${status_code}" -lt 400 ]; then
                deployed=true
                break
              fi

              sleep 3
            done

            if [ "${deployed}" != "true" ]; then
              echo "::error::Smoke test failed for ${route}"
              exit 1
            fi
          done

          echo "All deployed routes are available."

      - name: Write deployment summary
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deployment.outputs.url }}
        run: |
          {
            echo "## Frontend deployment"
            echo ""
            echo "| Property | Value |"
            echo "| --- | --- |"
            echo "| Project | ${CLOUDFLARE_PAGES_PROJECT} |"
            echo "| Cloudflare branch | ${CLOUDFLARE_BRANCH} |"
            echo "| CI run ID | ${CI_RUN_ID} |"
            echo "| Artifact | ${ARTIFACT_NAME} |"
            echo "| Deployment URL | ${DEPLOYMENT_URL} |"
          } >> "${GITHUB_STEP_SUMMARY}"