name: Frontend CD

on:
  workflow_run:
    workflows:
      - Frontend CI
    types:
      - completed
    branches:
      - develop
      - main

  workflow_dispatch:
    inputs:
      ci_run_id:
        description: "ID of a successful Frontend CI run"
        required: true
        type: string

      cloudflare_branch:
        description: "Cloudflare Pages deployment branch"
        required: true
        default: "preview"
        type: choice
        options:
          - preview
          - develop
          - main

permissions:
  contents: read
  actions: read
  deployments: write

concurrency:
  group: frontend-cd-${{
    github.event.workflow_run.head_branch ||
    inputs.cloudflare_branch ||
    github.ref_name
    }}
  cancel-in-progress: false

env:
  ARTIFACT_NAME: frontend-localized-build
  DEPLOY_DIRECTORY: frontend-build
  CLOUDFLARE_PAGES_PROJECT: translation-platform-frontend

jobs:
  deploy:
    name: Deploy frontend to Cloudflare Pages

    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Resolve deployment context
        id: context
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}

          AUTOMATIC_CI_RUN_ID: ${{ github.event.workflow_run.id }}
          AUTOMATIC_BRANCH: ${{ github.event.workflow_run.head_branch }}
          AUTOMATIC_SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}

          MANUAL_CI_RUN_ID: ${{ inputs.ci_run_id }}
          MANUAL_BRANCH: ${{ inputs.cloudflare_branch }}
        run: |
          if [ "${EVENT_NAME}" = "workflow_run" ]; then
            ci_run_id="${AUTOMATIC_CI_RUN_ID}"
            source_branch="${AUTOMATIC_BRANCH}"
            source_sha="${AUTOMATIC_SOURCE_SHA}"
            cloudflare_branch="${AUTOMATIC_BRANCH}"
          else
            if [ -z "${MANUAL_CI_RUN_ID}" ]; then
              echo "::error::Missing CI run ID."
              exit 1
            fi

            run_json="$(
              gh api \
                "repos/${GITHUB_REPOSITORY}/actions/runs/${MANUAL_CI_RUN_ID}"
            )"

            workflow_name="$(
              echo "${run_json}" | jq --raw-output '.name // empty'
            )"

            conclusion="$(
              echo "${run_json}" | jq --raw-output '.conclusion // empty'
            )"

            source_branch="$(
              echo "${run_json}" | jq --raw-output '.head_branch // empty'
            )"

            source_sha="$(
              echo "${run_json}" | jq --raw-output '.head_sha // empty'
            )"

            if [ "${workflow_name}" != "Frontend CI" ]; then
              echo "::error::The selected run is not a Frontend CI run."
              exit 1
            fi

            if [ "${conclusion}" != "success" ]; then
              echo "::error::The selected Frontend CI run was not successful."
              exit 1
            fi

            ci_run_id="${MANUAL_CI_RUN_ID}"
            cloudflare_branch="${MANUAL_BRANCH}"
          fi

          
          if [ "${EVENT_NAME}" = "workflow_run" ]; then

            case "${source_branch}" in
              develop|main)
                ;;
              *)
                echo "::error::Automatic deployment is only allowed from develop or main."
                exit 1
                ;;
            esac

            if [ "${cloudflare_branch}" != "${source_branch}" ]; then
              echo "::error::Cloudflare branch must match the source branch."
              exit 1
            fi

          else

            case "${source_branch}" in
              develop)
                if [ "${cloudflare_branch}" != "develop" ]; then
                  echo "::error::Develop CI runs must deploy to the develop branch."
                  exit 1
                fi
                ;;

              main)
                if [ "${cloudflare_branch}" != "main" ]; then
                  echo "::error::Main CI runs must deploy to the main branch."
                  exit 1
                fi
                ;;

              feature/*)
                if [ "${cloudflare_branch}" != "preview" ]; then
                  echo "::error::Feature branches may only deploy to the preview branch."
                  exit 1
                fi
                ;;

              *)
                echo "::error::Unsupported source branch: ${source_branch}"
                exit 1
                ;;
            esac

          fi
          

          if [ -z "${source_sha}" ]; then
            echo "::error::Missing source commit SHA."
            exit 1
          fi

          echo "ci_run_id=${ci_run_id}" >> "${GITHUB_OUTPUT}"
          echo "source_branch=${source_branch}" >> "${GITHUB_OUTPUT}"
          echo "source_sha=${source_sha}" >> "${GITHUB_OUTPUT}"
          echo "cloudflare_branch=${cloudflare_branch}" >> "${GITHUB_OUTPUT}"

          echo "CI run ID: ${ci_run_id}"
          echo "Source branch: ${source_branch}"
          echo "Source commit: ${source_sha}"
          echo "Cloudflare branch: ${cloudflare_branch}"

      - name: Checkout deployed commit
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.context.outputs.source_sha }}

      - name: Check Cloudflare configuration
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "::error::Missing secret: CLOUDFLARE_API_TOKEN"
            exit 1
          fi

          if [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "::error::Missing secret: CLOUDFLARE_ACCOUNT_ID"
            exit 1
          fi

          echo "Cloudflare configuration is available."

      - name: Download validated frontend artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.DEPLOY_DIRECTORY }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.context.outputs.ci_run_id }}

      - name: Verify downloaded artifact
        shell: bash
        run: |
          echo "Downloaded artifact content:"
          find "${DEPLOY_DIRECTORY}" -maxdepth 3 -type f | sort

          required_files=(
            "${DEPLOY_DIRECTORY}/index.html"
            "${DEPLOY_DIRECTORY}/fr/index.html"
            "${DEPLOY_DIRECTORY}/de/index.html"
          )

          for file_path in "${required_files[@]}"; do
            if [ ! -f "${file_path}" ]; then
              echo "::error::Missing deployment file: ${file_path}"
              exit 1
            fi

            echo "Found: ${file_path}"
          done

          echo "The validated frontend artifact is ready for deployment."

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: >-
            pages deploy ${{ env.DEPLOY_DIRECTORY }}
            --project-name=${{ env.CLOUDFLARE_PAGES_PROJECT }}
            --branch=${{ steps.context.outputs.cloudflare_branch }}
          gitHubToken: ${{ github.token }}

      - name: Get deployment URL
        id: deployment
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          DEPLOYMENT_ALIAS_URL: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
        run: |
          url="${DEPLOYMENT_URL}"

          if [ -z "${url}" ]; then
            url="${DEPLOYMENT_ALIAS_URL}"
          fi

          if [ -z "${url}" ]; then
            echo "::error::Cloudflare did not return a deployment URL."
            exit 1
          fi

          url="${url%/}"

          echo "url=${url}" >> "${GITHUB_OUTPUT}"
          echo "Deployment URL: ${url}"

      - name: Run deployment smoke tests
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deployment.outputs.url }}
        run: |
          for route in "/" "/fr/" "/de/"; do
            deployed=false

            for attempt in {1..10}; do
              status_code="$(
                curl \
                  --silent \
                  --show-error \
                  --location \
                  --output /dev/null \
                  --write-out "%{http_code}" \
                  "${DEPLOYMENT_URL}${route}" || true
              )"

              echo "Attempt ${attempt}: ${route} returned HTTP ${status_code}"

              if [[ "${status_code}" =~ ^[0-9]{3}$ ]] &&
                 [ "${status_code}" -ge 200 ] &&
                 [ "${status_code}" -lt 400 ]; then
                deployed=true
                break
              fi

              sleep 3
            done

            if [ "${deployed}" != "true" ]; then
              echo "::error::Smoke test failed for ${route}"
              exit 1
            fi
          done

          echo "All deployed routes are available."

      - name: Write deployment summary
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deployment.outputs.url }}
          CI_RUN_ID: ${{ steps.context.outputs.ci_run_id }}
          SOURCE_BRANCH: ${{ steps.context.outputs.source_branch }}
          SOURCE_SHA: ${{ steps.context.outputs.source_sha }}
          CLOUDFLARE_BRANCH: ${{ steps.context.outputs.cloudflare_branch }}
        run: |
          {
            echo "## Frontend deployment"
            echo ""
            echo "| Property | Value |"
            echo "| --- | --- |"
            echo "| Cloudflare project | ${CLOUDFLARE_PAGES_PROJECT} |"
            echo "| Source branch | ${SOURCE_BRANCH} |"
            echo "| Cloudflare branch | ${CLOUDFLARE_BRANCH} |"
            echo "| Source commit | ${SOURCE_SHA} |"
            echo "| CI run ID | ${CI_RUN_ID} |"
            echo "| Artifact | ${ARTIFACT_NAME} |"
            echo "| Deployment URL | ${DEPLOYMENT_URL} |"
          } >> "${GITHUB_STEP_SUMMARY}"