name: Frontend CD

on:
  workflow_run:
    workflows:
      - Frontend CI
    types:
      - completed
    branches:
      - develop
      - main

  workflow_dispatch:
    inputs:
      ci_run_id:
        description: "ID of a successful Frontend CI run"
        required: true
        type: string

      cloudflare_branch:
        description: "Cloudflare Pages branch"
        required: true
        default: "develop"
        type: string

permissions:
  contents: read
  actions: read
  deployments: write

concurrency:
  group: frontend-cd-${{
    github.event_name == 'workflow_run'
    && github.event.workflow_run.head_branch
    || inputs.cloudflare_branch
    }}
  cancel-in-progress: false

env:
  ARTIFACT_NAME: frontend-localized-build
  DEPLOY_DIRECTORY: frontend-build
  CLOUDFLARE_PAGES_PROJECT: translation-platform-frontend

  CI_RUN_ID: ${{
    github.event_name == 'workflow_run'
    && github.event.workflow_run.id
    || inputs.ci_run_id
    }}

  CLOUDFLARE_BRANCH: ${{
    github.event_name == 'workflow_run'
    && github.event.workflow_run.head_branch
    || inputs.cloudflare_branch
    }}

  SOURCE_SHA: ${{
    github.event_name == 'workflow_run'
    && github.event.workflow_run.head_sha
    || github.sha
    }}

jobs:
  deploy:
    name: Deploy frontend to Cloudflare Pages

    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout deployed commit
        uses: actions/checkout@v6
        with:
          ref: ${{ env.SOURCE_SHA }}

      - name: Check deployment configuration
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "::error::Missing secret: CLOUDFLARE_API_TOKEN"
            exit 1
          fi

          if [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "::error::Missing secret: CLOUDFLARE_ACCOUNT_ID"
            exit 1
          fi

          if [ -z "${CI_RUN_ID}" ]; then
            echo "::error::Missing CI run ID."
            exit 1
          fi

          if [ -z "${CLOUDFLARE_BRANCH}" ]; then
            echo "::error::Missing Cloudflare branch."
            exit 1
          fi

          echo "Cloudflare configuration is available."
          echo "CI run ID: ${CI_RUN_ID}"
          echo "Source commit: ${SOURCE_SHA}"
          echo "Cloudflare branch: ${CLOUDFLARE_BRANCH}"

      - name: Download validated frontend artifact
        uses: actions/download-artifact@v7
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.DEPLOY_DIRECTORY }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.CI_RUN_ID }}

      - name: Verify downloaded artifact
        shell: bash
        run: |
          required_files=(
            "${DEPLOY_DIRECTORY}/index.html"
            "${DEPLOY_DIRECTORY}/fr/index.html"
            "${DEPLOY_DIRECTORY}/de/index.html"
          )

          for file_path in "${required_files[@]}"; do
            if [ ! -f "${file_path}" ]; then
              echo "::error::Missing deployment file: ${file_path}"
              exit 1
            fi

            echo "Found: ${file_path}"
          done

          echo "The frontend artifact is ready for deployment."

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy ${{ env.DEPLOY_DIRECTORY }}
            --project-name=${{ env.CLOUDFLARE_PAGES_PROJECT }}
            --branch=${{ env.CLOUDFLARE_BRANCH }}
          gitHubToken: ${{ github.token }}

      - name: Get deployment URL
        id: deployment
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          DEPLOYMENT_ALIAS_URL: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
        run: |
          url="${DEPLOYMENT_URL}"

          if [ -z "${url}" ]; then
            url="${DEPLOYMENT_ALIAS_URL}"
          fi

          if [ -z "${url}" ]; then
            echo "::error::Cloudflare did not return a deployment URL."
            exit 1
          fi

          url="${url%/}"

          echo "url=${url}" >> "${GITHUB_OUTPUT}"
          echo "Deployment URL: ${url}"

      - name: Run deployment smoke tests
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deployment.outputs.url }}
        run: |
          for route in "/" "/fr/" "/de/"; do
            deployed=false

            for attempt in {1..10}; do
              status_code="$(
                curl \
                  --silent \
                  --show-error \
                  --location \
                  --output /dev/null \
                  --write-out "%{http_code}" \
                  "${DEPLOYMENT_URL}${route}" || true
              )"

              echo "Attempt ${attempt}: ${route} returned HTTP ${status_code}"

              if [[ "${status_code}" =~ ^[0-9]{3}$ ]] &&
                 [ "${status_code}" -ge 200 ] &&
                 [ "${status_code}" -lt 400 ]; then
                deployed=true
                break
              fi

              sleep 3
            done

            if [ "${deployed}" != "true" ]; then
              echo "::error::Smoke test failed for ${route}"
              exit 1
            fi
          done

          echo "All deployed routes are available."

      - name: Write deployment summary
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deployment.outputs.url }}
        run: |
          {
            echo "## Frontend deployment"
            echo ""
            echo "| Property | Value |"
            echo "| --- | --- |"
            echo "| Project | ${CLOUDFLARE_PAGES_PROJECT} |"
            echo "| Cloudflare branch | ${CLOUDFLARE_BRANCH} |"
            echo "| Source commit | ${SOURCE_SHA} |"
            echo "| CI run ID | ${CI_RUN_ID} |"
            echo "| Artifact | ${ARTIFACT_NAME} |"
            echo "| Deployment URL | ${DEPLOYMENT_URL} |"
          } >> "${GITHUB_STEP_SUMMARY}"