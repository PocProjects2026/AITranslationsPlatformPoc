server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'" always;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = / {
        try_files /en/index.html =404;
    }

    location = /en {
        return 301 /;
    }

    location = /fr {
        return 301 /fr/;
    }

    location = /de {
        return 301 /de/;
    }

    location /en/ {
        try_files $uri $uri/ /en/index.html;
    }

    location /fr/ {
        try_files $uri $uri/ /fr/index.html;
    }

    location /de/ {
        try_files $uri $uri/ /de/index.html;
    }

    location ~* \.(?:css|js|ico|png|jpg|jpeg|gif|svg|webp|woff|woff2)$ {
        try_files $uri =404;
        expires 1y;
    }
}